name: ISO x86_64

# ISO x86_64. No corre en pull_request ni en push: el build es lento y no
# es un check obligatorio. Se dispara a mano (ref y edición) y cada noche
# sobre main. Una corrida nueva de la misma ref cancela la anterior.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama, tag o SHA. Vacío = la rama desde la que se dispara."
        required: false
        default: ""
        type: string
      edition:
        description: Edición
        required: true
        default: niri
        type: choice
        options:
          - niri
          - xfce
          - kde
          - server
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: iso-x86_64-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  iso:
    name: Build x86_64 ISO
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      ref: ${{ steps.meta.outputs.ref }}
      edition: ${{ steps.meta.outputs.edition }}
      iso_name: ${{ steps.meta.outputs.iso_name }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout de los scripts de CI
        uses: actions/checkout@v7
        with:
          path: _workflow
          sparse-checkout: scripts/ci

      - name: Liberar disco
        run: bash _workflow/scripts/ci/free-runner-disk.sh

      - name: Resolver ref y edición
        id: spec
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_EDITION: ${{ github.event.inputs.edition }}
        run: bash _workflow/scripts/ci/resolve-build.sh

      - name: Checkout del código a construir
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.spec.outputs.ref }}
          path: src
          fetch-depth: 1

      - name: Caché de pacman
        id: cache-pacman
        uses: actions/cache/restore@v4
        with:
          path: src/.ci-cache/pacman
          key: iso-x86-pacman-${{ hashFiles('src/archiso/packages.x86_64', 'src/archiso/pacman.x86_64.conf', 'src/Containerfile') }}
          restore-keys: iso-x86-pacman-

      - name: Caché de cargo (registro)
        id: cache-cargo-home
        uses: actions/cache/restore@v4
        with:
          path: src/.ci-cache/home
          key: iso-x86-cargo-home-${{ hashFiles('src/rust/Cargo.lock', 'src/Containerfile') }}
          restore-keys: iso-x86-cargo-home-

      - name: Caché de cargo (target)
        id: cache-cargo-target
        uses: actions/cache/restore@v4
        with:
          path: src/rust/target/container
          key: iso-x86-cargo-target-${{ hashFiles('src/rust/Cargo.lock', 'src/Containerfile') }}
          restore-keys: iso-x86-cargo-target-

      - name: Build ISO
        working-directory: src
        env:
          CHURROS_CONTAINER_ENGINE: docker
          CHURROS_CONTAINER_CACHE_VOL: ${{ github.workspace }}/src/.ci-cache/pacman
          CHURROS_CONTAINER_HOME_VOL: ${{ github.workspace }}/src/.ci-cache/home
          EDITION: ${{ steps.spec.outputs.edition }}
        run: |
          mkdir -p "$CHURROS_CONTAINER_CACHE_VOL" "$CHURROS_CONTAINER_HOME_VOL"
          ./churros build --container --edition "$EDITION"

      - name: Permisos de la caché
        if: always()
        run: sudo chmod -R a+rX src/.ci-cache || true

      - name: Guardar caché de pacman
        if: always() && steps.cache-pacman.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src/.ci-cache/pacman
          key: ${{ steps.cache-pacman.outputs.cache-primary-key }}

      - name: Guardar caché de cargo (registro)
        if: always() && steps.cache-cargo-home.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src/.ci-cache/home
          key: ${{ steps.cache-cargo-home.outputs.cache-primary-key }}

      - name: Guardar caché de cargo (target)
        if: always() && steps.cache-cargo-target.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src/rust/target/container
          key: ${{ steps.cache-cargo-target.outputs.cache-primary-key }}

      - name: Metadatos de la ISO
        id: meta
        working-directory: src
        env:
          BUILD_EDITION: ${{ steps.spec.outputs.edition }}
          BUILD_ARCH: x86_64
          BUILD_REF_NAME: ${{ steps.spec.outputs.ref }}
        run: bash "$GITHUB_WORKSPACE/_workflow/scripts/ci/record-iso-meta.sh" out

      - name: SHA256 y resumen
        working-directory: src
        env:
          BUILD_COMMIT: ${{ steps.meta.outputs.sha }}
          BUILD_EDITION: ${{ steps.meta.outputs.edition }}
          BUILD_ARCH: x86_64
        run: bash "$GITHUB_WORKSPACE/_workflow/scripts/ci/iso-summarize.sh" out

      - name: Subir ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}-iso
          path: src/out/*.iso
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Subir SHA256SUMS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}-sha256
          path: src/out/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Smoke x86_64
    needs: iso
    if: always() && needs.iso.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Liberar disco
        run: bash scripts/ci/free-runner-disk.sh

      - name: Habilitar KVM
        run: bash scripts/ci/enable-kvm.sh

      - name: Paquetes del humo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf imagemagick curl shellcheck gettext zstd

      - name: Bajar la ISO
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.iso.outputs.artifact }}-iso
          path: iso

      - name: Bajar SHA256SUMS
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.iso.outputs.artifact }}-sha256
          path: iso

      - name: churros-verify smoke
        env:
          BUILD_SHA: ${{ needs.iso.outputs.sha }}
          BUILD_REF: ${{ needs.iso.outputs.ref }}
          EDITION: ${{ needs.iso.outputs.edition }}
          ISO_NAME: ${{ needs.iso.outputs.iso_name }}
        run: bash scripts/ci/run-x86-smoke.sh

      - name: Quitar el disco de la VM
        if: always()
        run: |
          rm -f scripts/qa/runs/latest
          find scripts/qa/runs -name disk.qcow2 -delete 2>/dev/null || true

      - name: Subir runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.iso.outputs.artifact }}-smoke
          path: scripts/qa/runs/
          if-no-files-found: ignore
          retention-days: 7
